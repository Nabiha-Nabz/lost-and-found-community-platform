<article class="item-card"><a class="item-image" href="{{ url_for('main.item_detail', item_id=item.id) }}"><img src="{{ url_for('static', filename=item.primary_image) }}" alt="Photo for {{ item.title }}"><span class="badge badge-{{ item.item_type }}">{{ item.item_type|title }}</span></a><div class="item-body"><span class="item-category">{{ item.category }}</span><h3><a href="{{ url_for('main.item_detail', item_id=item.id) }}">{{ item.title }}</a></h3><p>{{ item.location_name }}</p><div class="item-meta"><span>{{ item.date_lost_found.strftime('%d %b %Y') }}</span><span class="status status-{{ item.status|lower|replace(' ','-') }}">{{ item.status }}</span></div></div></article>
